<!DOCTYPE html>
<html lang="hi">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Stock Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:13px;padding:6px 5px 95px}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:8px 12px;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.top h1{font-size:15px;font-weight:800}
.mbtn{background:#2563eb;color:#fff;border:0;width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:800}
.dt{display:flex;justify-content:space-between;background:#fff;padding:6px 10px;border-radius:10px;margin-bottom:6px;font-size:11px;color:#64748b}
.dt .c{color:#2563eb;font-weight:700}
.dt b{color:#16a34a}
.sv{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:14px;font-weight:800;margin-bottom:6px}
.ur{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.ur button{padding:9px;border:0;border-radius:8px;font-size:12px;font-weight:700;background:#475569;color:#fff}
.card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.r{display:grid;grid-template-columns:1.3fr 2fr minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:3px;padding:6px 4px;align-items:center;border-bottom:1px solid #e2e8f0}
.r:last-child{border-bottom:0}
.r.h{background:#0f172a;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:10px 4px;text-transform:uppercase}
.r.h .p{text-align:left;padding-left:2px;font-size:10px}
.p{font-size:15px;font-weight:800;overflow:hidden;line-height:1.15}
.st{display:flex;gap:2px;height:30px;min-width:0;align-items:stretch}
.sb{flex:0 0 20px;border:0;border-radius:4px;font-size:20px;font-weight:900;color:#fff;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.sb.m{background:#f97316}.sb.p{background:#22c55e}
.ci{flex:1;min-width:0;padding:1px;text-align:center;font-weight:800;font-size:10px;background:#fef3c7;border:1px solid #fbbf24;border-radius:4px;color:#78350f;height:30px}
.pd{text-align:center;font-weight:800;font-size:13px;padding:8px 0;border-radius:6px;background:#e0e7ff;color:#1e40af;overflow:hidden}
.si{width:100%;min-width:0;padding:7px 2px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;text-align:center;background:#f8fafc;font-weight:700}
.df{text-align:center;font-weight:800;font-size:13px;padding:8px 0;border-radius:6px;background:#f1f5f9;color:#64748b;overflow:hidden}
.df.p{background:#dcfce7;color:#166534}.df.n{background:#fee2e2;color:#b91c1c}
.bl{background:#e0e7ff;color:#1e40af;padding:7px 10px;font-size:12px;font-weight:800;text-transform:uppercase;display:flex;justify-content:space-between}
.bl span:last-child{font-size:9px;text-transform:none}
.gb{position:fixed;left:0;right:0;bottom:0;background:#0f172a;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;z-index:100}
.gb .it{text-align:center}
.gb .l{font-size:9px;color:#cbd5e1;text-transform:uppercase;font-weight:700}
.gb .v{font-size:17px;font-weight:800;color:#fbbf24}
.gb .v.pcs{color:#60a5fa}.gb .v.po{color:#4ade80}.gb .v.ne{color:#f87171}
.fb{position:fixed;right:14px;bottom:78px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:0;font-size:22px;z-index:90;box-shadow:0 4px 16px rgba(139,92,246,.5)}
.tst{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:all .3s;max-width:90%;text-align:center}
.tst.s{transform:translateX(-50%) translateY(0);opacity:1}
.tst.e{background:#dc2626}.tst.i{background:#2563eb}
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:550}
.dbg.o{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:88vw;background:#fff;z-index:600;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
.dw.o{transform:translateX(0)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#2563eb;color:#fff;font-weight:800;font-size:16px}
.dh button{background:transparent;border:0;color:#fff;font-size:24px;padding:0}
.dbd{flex:1;overflow-y:auto;padding:8px 0}
.di{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;background:transparent;color:#0f172a;font-size:14px;font-weight:600;text-align:left}
.di span:first-child{font-size:20px;width:26px;text-align:center}
.di.dg{color:#dc2626}
.db{margin-left:auto;background:#dc2626;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px}
.dsep{height:1px;background:#e2e8f0;margin:6px 0}
.mg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:700;padding:12px}
.mg.s{display:flex}
.md{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:12px 14px;background:#8b5cf6;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.mh.sync{background:#16a34a}
.mh button{background:transparent;border:0;color:#fff;font-size:22px;padding:0}
.mb{padding:16px;overflow-y:auto;flex:1;background:#f1f5f9;text-align:center}
.mb p{font-size:13px;color:#475569;margin-bottom:14px;font-weight:600}
.mf{padding:10px 12px;display:grid;grid-template-columns:1fr;gap:8px;background:#f1f5f9;border-top:1px solid #e2e8f0}
.mf button{padding:12px;border:0;border-radius:9px;font-size:13px;font-weight:800;color:#fff}
.em{text-align:center;padding:40px 20px;color:#64748b;font-size:13px}
.cm{border-radius:14px;width:100%;max-width:320px;overflow:hidden;background:#fff}
.cd{background:#0f172a;color:#fff;padding:12px 16px;text-align:right;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.cd .p{font-size:11px;color:#94a3b8;min-height:14px;font-weight:600}
.cd .c{font-size:28px;font-weight:800;word-break:break-all}
.cgr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px}
.cb{padding:15px 0;border:0;border-radius:10px;font-size:18px;font-weight:800;background:#f1f5f9;color:#0f172a}
.cb.o{background:#dbeafe;color:#1e40af;font-size:20px}
.cb.e{background:#2563eb;color:#fff}
.cb.x{background:#fee2e2;color:#b91c1c}
.cb.t{grid-row:span 2}.cb.s2{grid-column:span 2}
</style>
</head>
<body>

<div class="top">
  <h1>Stock Pro</h1>
  <button class="mbtn" onclick="tm()">☰</button>
</div>

<div class="dt">
  <div class="c" id="cl">—</div>
  <div>Saved: <b id="ls">—</b></div>
</div>

<button class="sv" onclick="save()">💾 SAVE</button>

<div class="ur">
  <button onclick="un()">↶ Undo</button>
  <button onclick="re()">↷ Redo</button>
</div>

<div class="card">
  <div class="r h"><div class="p">Product</div><div>Cotton</div><div>Pcs</div><div>Soft.</div><div>Diff</div></div>
</div>

<div id="app"></div>

<button class="fb" onclick="om('cm')">🧮</button>

<div class="gb">
  <div class="it"><div class="l">Cotton</div><div class="v" id="gc">0</div></div>
  <div class="it"><div class="l">Pcs</div><div class="v pcs" id="gp">0</div></div>
  <div class="it"><div class="l">Diff</div><div class="v" id="gd">0</div></div>
</div>

<div class="dbg" id="dbg" onclick="tm()"></div>
<div class="dw" id="dw">
  <div class="dh"><span>📋 Menu</span><button onclick="tm()">✕</button></div>
  <div class="dbd">
    <button class="di" style="color:#16a34a;font-weight:800" onclick="tm();exportSyncFile()"><span>📤</span>Create Sync File (Send)</button>
    <button class="di" style="color:#25d366;font-weight:800" onclick="tm();sendSyncWhatsApp()"><span>💬</span>Send Sync to WhatsApp</button>
    <button class="di" style="color:#2563eb;font-weight:800" onclick="tm();document.getElementById('sync-file-input').click()"><span>📥</span>Open Sync File (Receive)</button>
    <div class="dsep"></div>
    <button class="di" onclick="tm();oH()"><span>📅</span>History</button>
    <button class="di" onclick="tm();oL()"><span>🔴</span>Low Stock<span class="db" id="lb">0</span></button>
    <button class="di" onclick="tm();oS()"><span>📸</span>Screenshot</button>
    <button class="di" onclick="tm();oW()"><span>📱</span>Text Report</button>
    <div class="dsep"></div>
    <button class="di" onclick="tm();oP()"><span>➕</span>Products</button>
    <button class="di" onclick="tm();oT()"><span>🎨</span>Theme</button>
    <button class="di" onclick="tm();oPin()"><span>🔒</span>Set PIN</button>
    <div class="dsep"></div>
    <button class="di" onclick="tm();bk()"><span>💾</span>Backup</button>
    <button class="di" onclick="tm();document.getElementById('rf').click()"><span>📂</span>Restore</button>
    <button class="di" onclick="tm();csv()"><span>📊</span>CSV</button>
    <div class="dsep"></div>
    <button class="di dg" onclick="tm();rs()"><span>🗑️</span>Reset</button>
  </div>
</div>

<input type="file" id="sync-file-input" accept=".stock" style="display:none" onchange="importSyncFile(event)">

<div class="mg" id="cm"><div class="cm"><div class="mh c"><span>🧮 Calculator</span><button onclick="cm2('cm')">✕</button></div><div class="cd"><div class="p" id="cp"></div><div class="c" id="cc">0</div></div><div class="cgr" id="cg"></div></div></div>
<div class="mg" id="hm"><div class="md"><div class="mh h"><span id="ht">📅 History</span><button onclick="cm2('hm')">✕</button></div><div class="mb" id="hb"></div></div></div>
<div class="mg" id="lm"><div class="md"><div class="mh r"><span>🔴 Low Stock</span><button onclick="cm2('lm')">✕</button></div><div class="mb" id="lbm"></div></div></div>
<div class="mg" id="pm"><div class="md"><div class="mh"><span>➕ Products</span><button onclick="cm2('pm')">✕</button></div><div class="mb" id="pmb"></div></div></div>
<div class="mg" id="tm2"><div class="md"><div class="mh"><span>🎨 Theme</span><button onclick="cm2('tm2')">✕</button></div><div class="mb" id="tmb"></div></div></div>
<div class="mg" id="pim"><div class="md"><div class="mh"><span>🔒 Set PIN</span><button onclick="cm2('pim')">✕</button></div><div class="mb" style="text-align:left">
<label>New PIN (4 digits)</label><input type="tel" id="pi1" maxlength="4" inputmode="numeric">
<label>Confirm PIN</label><input type="tel" id="pi2" maxlength="4" inputmode="numeric">
<button style="width:100%;padding:11px;background:#16a34a;color:#fff;border:0;border-radius:9px;font-weight:800;margin-top:8px" onclick="sp()">Save PIN</button>
<button style="width:100%;padding:11px;background:#dc2626;color:#fff;border:0;border-radius:9px;font-weight:800;margin-top:8px" onclick="rp()">Remove PIN</button>
</div></div></div>
<div class="mg" id="sm"><div class="md"><div class="mh"><span>📸 Screenshot</span><button onclick="cm2('sm')">✕</button></div><div class="mb"><img id="si"></div><div class="mf t"><button class="c" onclick="csh()">📋</button><button class="d" onclick="dsh()">⬇️ Save</button><button class="s" onclick="ssh()">Share</button></div></div></div>
<div class="mg" id="wm"><div class="md"><div class="mh" style="background:#25D366"><span>📱 Text Report</span><button onclick="cm2('wm')">✕</button></div><div class="mb" style="text-align:left"><textarea id="wt" readonly style="width:100%;min-height:180px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-family:monospace;font-size:12px;background:#f8fafc;resize:none"></textarea></div><div class="mf" style="grid-template-columns:1fr 1fr"><button class="c" style="background:#64748b" onclick="cw()">📋 Copy</button><button class="s" style="background:#25D366" onclick="sw()">Share</button></div></div></div>

<input type="file" id="rf" accept=".json" style="display:none">
<input type="file" id="pf" accept="image/*" style="display:none">
<div class="tst" id="tst"></div>

<script>
var M=4,KS='sp_d',KM='sp_m',KH='sp_h',KP='sp_p',KSET='sp_s',KU='sp_u',KR='sp_r';
var secretKey='stock_secret_123';
var DP=[{b:'Gold',n:'Gold Small'},{b:'Gold',n:'Gold Medium'},{b:'Gold',n:'Gold Large'},{b:'Gold',n:'Gold XL'},{b:'Gold',n:'Gold XXL'},{b:'Baby Baba',n:'Baby Baba Small'},{b:'Baby Baba',n:'Baby Baba Medium'},{b:'Baby Baba',n:'Baby Baba Large'},{b:'Baby Baba',n:'Baby Baba XL'}];
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sk(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var P=ld(KP,DP),D=ld(KS,{}),Me=ld(KM,{}),St=ld(KSET,{theme:'',pin:'',low:{},pho:{}}),US=ld(KU,[]),RS=ld(KR,[]),sBlob=null,pBuf='',dSv=null;

function now(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function tk(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ps(s){s=String(s==null?'':s).trim();if(!s||s==='.')return{w:0,p:0};var d=s.indexOf('.');if(d===-1)return{w:parseInt(s,10)||0,p:0};return{w:parseInt(s.slice(0,d),10)||0,p:parseInt(s.slice(d+1),10)||0}}
function ts(m,t){var e=document.getElementById('tst');e.textContent=m;e.className='tst s'+(t?' '+t:'');setTimeout(function(){e.classList.remove('s')},2500)}
function cm2(id){document.getElementById(id).classList.remove('s')}
function om(id){document.getElementById(id).classList.add('s')}
function tm(){document.getElementById('dw').classList.toggle('o');document.getElementById('dbg').classList.toggle('o')}

function as(){if(dSv)clearTimeout(dSv);dSv=setTimeout(function(){Me.lastSaved=now();sk(KS,D);sk(KM,Me);rsv()},600)}
function hs(){Me.lastSaved=now();sk(KS,D);sk(KM,Me);rsv()}
function rsv(){document.getElementById('ls').textContent=Me.lastSaved||'—'}

function pu(){US.push(JSON.parse(JSON.stringify(D)));if(US.length>30)US.shift();RS=[];sk(KU,US);sk(KR,RS)}
function un(){if(!US.length){ts('Kuch undo nahi','e');return}RS.push(JSON.parse(JSON.stringify(D)));D=US.pop();sk(KU,US);sk(KR,RS);sk(KS,D);rd();ts('↶ Undo','i')}
function re(){if(!RS.length){ts('Kuch redo nahi','e');return}US.push(JSON.parse(JSON.stringify(D)));D=RS.pop();sk(KU,US);sk(KR,RS);sk(KS,D);rd();ts('↷ Redo','i')}

function gc(n){return String((D[n]||{}).cotton||'')}
function sc(n,v){if(!D[n])D[n]={};D[n].cotton=String(v==null?'':v);D[n].ct=now();as()}
function gs(n){return Number((D[n]||{}).software||0)}
function ss(n,v){if(!D[n])D[n]={};D[n].software=Number(v)||0;D[n].st=now();as()}
function gct(n){return(D[n]||{}).ct||''}
function gst(n){return(D[n]||{}).st||''}
function pcs(n){var x=ps(gc(n));return x.w*M+x.p}
function df(n){return pcs(n)-gs(n)}
function fc(t){if(t<=0)return'0';var w=Math.floor(t/M),r=t%M;return r===0?String(w):w+'.'+r}
function hp(d,n){var x=ps(String((d[n]||{}).cotton||'0'));return x.w*M+x.p}
function hd(d,n){return hp(d,n)-Number((d[n]||{}).software||0)}

function at(){document.body.className='';if(St.theme)document.body.classList.add('t-'+St.theme)}

function rd(){
  var bs=[...new Set(P.map(function(x){return x.b}))],h='';
  bs.forEach(function(b){
    h+='<div class="card"><div class="bl"><span>'+b+'</span><span data-bt="'+b+'"></span></div>';
    P.filter(function(x){return x.b===b}).forEach(function(p){
      var c=gc(p.n),pc=pcs(p.n),d=df(p.n),cl=d>0?'p':d<0?'n':'';
      h+='<div class="r" data-n="'+p.n+'"><div class="p">'+p.n+'</div>'+
        '<div class="st"><button class="sb m" data-s="-1">−</button>'+
        '<input type="text" inputmode="decimal" class="ci" value="'+c+'" data-f="cotton" placeholder="0">'+
        '<button class="sb p" data-s="1">+</button></div>'+
        '<div class="pd">'+pc+'</div>'+
        '<input type="text" inputmode="decimal" class="si" value="'+(gs(p.n)||'')+'" data-f="software" placeholder="0">'+
        '<div class="df '+cl+'">'+d+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('app').innerHTML=h;
  ae();ug();ubt();rsv();ulb();
}
function ubt(){[...new Set(P.map(function(x){return x.b}))].forEach(function(b){
  var el=document.querySelector('[data-bt="'+b+'"]');if(!el)return;var lt='';
  P.filter(function(x){return x.b===b}).forEach(function(p){var t=gct(p.n)||gst(p.n);if(t&&t>lt)lt=t});
  el.textContent=lt?'🕐 '+lt:'';
})}
function ae(){
  var a=document.getElementById('app');
  a.addEventListener('input',function(e){
    var i=e.target;if(!i.matches('input[data-f]'))return;
    var cl=i.value.replace(/[^0-9.]/g,''),fd=cl.indexOf('.');
    if(fd!==-1)cl=cl.slice(0,fd+1)+cl.slice(fd+1).replace(/\./g,'');
    if(cl!==i.value)i.value=cl;
    var r=i.closest('.r'),n=r.dataset.n,f=i.dataset.f;
    if(f==='cotton')sc(n,cl);else ss(n,cl);
    ur(r,n);ug();ubt();ulb();
  });
  a.querySelectorAll('.ci,.si').forEach(function(i){i.addEventListener('focus',function(){setTimeout(function(){i.select()},10)})});
  a.querySelectorAll('.sb').forEach(function(b){
    var r=b.closest('.r'),st=Number(b.dataset.s),iv=null,ht=null;
    var go=function(){var i=r.querySelector('.ci'),x=ps(i.value),nw=x.w+st;if(nw<0)nw=0;
      var nv=x.p>0?nw+'.'+x.p:String(nw);i.value=nw===0&&x.p===0?'':nv;
      sc(r.dataset.n,i.value);ur(r,r.dataset.n);ug();ubt();ulb()};
    var sh=function(e){e.preventDefault();pu();go();ht=setTimeout(function(){iv=setInterval(go,100)},450)};
    var stp=function(){clearTimeout(ht);if(iv){clearInterval(iv);iv=null}};
    b.addEventListener('pointerdown',sh);b.addEventListener('pointerup',stp);b.addEventListener('pointerleave',stp);b.addEventListener('pointercancel',stp);
  });
}
function ur(r,n){var pc=pcs(n),d=df(n);r.querySelector('.pd').textContent=pc;
  var de=r.querySelector('.df');de.textContent=d;de.classList.remove('p','n');
  if(d>0)de.classList.add('p');else if(d<0)de.classList.add('n')}
function ug(){var tp=0,td=0;P.forEach(function(p){tp+=pcs(p.n);td+=df(p.n)});
  document.getElementById('gc').textContent=fc(tp);document.getElementById('gp').textContent=tp;
  var el=document.getElementById('gd');el.textContent=td;el.classList.remove('po','ne');
  if(td>0)el.classList.add('po');else if(td<0)el.classList.add('ne')}
function ulb(){var c=0;P.forEach(function(p){var t=St.low[p.n];if(t&&pcs(p.n)<t)c++});
  var b=document.getElementById('lb');b.textContent=c;b.style.display=c>0?'':'none'}

function save(){hs();
  var d=new Date(),dy=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],p=function(n){return String(n).padStart(2,'0')};
  var dd=dy[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  var td=p(d.getHours())+':'+p(d.getMinutes());
  var h=ld(KH,[]),dk=tk();
  var s={date:dk,dateDisp:dd,timeDisp:td,savedAt:now(),data:JSON.parse(JSON.stringify(D))};
  var i=h.findIndex(function(x){return x.date===dk});
  if(i>=0)h[i]=s;else h.unshift(s);
  if(h.length>90)h.length=90;
  sk(KH,h);ts('✅ Save','i')
}

function exportSyncFile(){
  var syncPayload = { data: D, products: P };
  var cipher = CryptoJS.AES.encrypt(JSON.stringify(syncPayload), secretKey).toString();
  var blob = new Blob([cipher], {type: 'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
