<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Stock Pro</title>
<script src="https://cloudflare.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:13px;padding:6px 5px 95px}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:8px 12px;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.top h1{font-size:15px;font-weight:800}
.mbtn{background:#2563eb;color:#fff;border:0;width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:800}
.dt{display:flex;justify-content:space-between;background:#fff;padding:6px 10px;border-radius:10px;margin-bottom:6px;font-size:11px;color:#64748b}
.dt .c{color:#2563eb;font-weight:700}
.dt b{color:#16a34a}
.sv{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:14px;font-weight:800;margin-bottom:6px}
.ur{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.ur button{padding:9px;border:0;border-radius:8px;font-size:12px;font-weight:700;background:#475569;color:#fff}
.card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.r{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:3px;padding:6px 4px;align-items:center;border-bottom:1px solid #e2e8f0}
.r:last-child{border-bottom:0}
.r.h{background:#0f172a;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:10px 4px;text-transform:uppercase}
.r.h .p{text-align:left;padding-left:2px;font-size:10px}
.p{font-size:13px;font-weight:800;overflow:hidden;line-height:1.15;white-space:nowrap;text-overflow:ellipsis}
.si{width:100%;min-width:0;padding:7px 2px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;text-align:center;background:#f8fafc;font-weight:700}
.si:focus{border-color:#2563eb;outline:none;background:#fff}
.df{text-align:center;font-weight:800;font-size:13px;padding:8px 0;border-radius:6px;background:#f1f5f9;color:#64748b;overflow:hidden}
.df.p{background:#dcfce7;color:#166534}.df.n{background:#fee2e2;color:#b91c1c}
.gb{position:fixed;left:0;right:0;bottom:0;background:#0f172a;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;z-index:100}
.gb .it{text-align:center}
.gb .l{font-size:9px;color:#cbd5e1;text-transform:uppercase;font-weight:700}
.gb .v{font-size:17px;font-weight:800;color:#fbbf24}
.gb .v.pcs{color:#60a5fa}.gb .v.po{color:#4ade80}.gb .v.ne{color:#f87171}
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:550}
.dbg.o{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:88vw;background:#fff;z-index:600;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
.dw.o{transform:translateX(0)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#2563eb;color:#fff;font-weight:800;font-size:16px}
.dh button{background:transparent;border:0;color:#fff;font-size:24px;padding:0}
.dbd{flex:1;overflow-y:auto;padding:8px 0}
.di{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;background:transparent;color:#0f172a;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.di span:first-child{font-size:20px;width:26px;text-align:center}
.tst{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:all .3s;max-width:90%;text-align:center}
.tst.s{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="tst" class="tst">ڈیٹا محفوظ ہو گیا ہے!</div>

<div class="top">
  <h1>Stock Pro</h1>
  <button class="mbtn" onclick="tm()">☰</button>
</div>

<div class="dt">
  <div class="c" id="cl">آج کی تاریخ</div>
  <div>Saved: <b id="ls">No</b></div>
</div>

<button class="sv" onclick="saveData()">💾 SAVE DATA</button>

<div class="ur">
  <button onclick="alert('نیا پروڈکٹ شامل کرنے کا فیچر')">➕ Add Product</button>
  <button onclick="resetFields()">🔄 Reset Fields</button>
</div>

<div class="card">
  <div class="r h">
    <div class="p">Product</div>
    <div>Cotton</div>
    <div>Pcs</div>
    <div>Soft.</div>
    <div>Diff</div>
  </div>
  <div id="app"></div>
</div>

<div class="gb">
  <div class="it"><div class="l">Total Cotton</div><div class="v" id="gc">0</div></div>
  <div class="it"><div class="l">Total Pcs</div><div class="v pcs" id="gp">0</div></div>
  <div class="it"><div class="l">Total Diff</div><div class="v" id="gd">0</div></div>
</div>

<div class="dbg" id="dbg" onclick="tm()"></div>
<div class="dw" id="dw">
  <div class="dh"><span>📋 Menu</span><button onclick="tm()">✕</button></div>
  <div class="dbd">
    <button class="di" style="color:#16a34a;font-weight:800" onclick="tm();alert('Sync File Created')"><span>📤</span>Create Sync File (Send)</button>
    <button class="di" style="color:#2563eb;font-weight:800" onclick="tm();alert('File Imported')"><span>📥</span>Import Sync File (Receive)</button>
  </div>
</div>

<script>
// ڈیمو پروڈکٹس کی لسٹ
const products = ["Product A", "Product B", "Product C", "Product D", "Product E"];

function initApp() {
  const container = document.getElementById('app');
  let html = '';
  
  products.forEach((prod, rIdx) => {
    html += `
      <div class="r" data-row="${rIdx}">
        <div class="p">${prod}</div>
        <div><input type="number" class="si" data-col="0" data-row="${rIdx}" oninput="calc(${rIdx})"></div>
        <div><input type="number" class="si" data-col="1" data-row="${rIdx}" oninput="calc(${rIdx})"></div>
        <div><input type="number" class="si" data-col="2" data-row="${rIdx}" oninput="calc(${rIdx})"></div>
        <div><div class="df" id="diff-${rIdx}">0</div></div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  setupEnterNavigation();
  updateDate();
}

// یہ فنکشن Enter بٹن دبانے پر کرسر کو نیچے والی رو (Row) پر بھیجتا ہے
function setupEnterNavigation() {
  document.getElementById('app').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const currentInput = e.target;
      if (currentInput.classList.contains('si')) {
        e.preventDefault(); // پیج ریفریش ہونے سے روکے
        
        const col = parseInt(currentInput.getAttribute('data-col'));
        const row = parseInt(currentInput.getAttribute('data-row'));
        
        // اگلی رو کا وہی کالم تلاش کریں
        const nextInput = document.querySelector(`input[data-col="${col}"][data-row="${row + 1}"]`);
        
        if (nextInput) {
          nextInput.focus();
          nextInput.select(); // ٹیکس کو خود بخود سلیکٹ کر لے تاکہ لکھنا آسان ہو
        }
      }
    }
  });
}

// ہر رو کا حساب کتاب (Formula: Cotton - Pcs = Diff)
function calc(rowIdx) {
  const inputs = document.querySelectorAll(`input[data-row="${rowIdx}"]`);
  const cotton = parseFloat(inputs[0].value) || 0;
  const pcs = parseFloat(inputs[1].value) || 0;
  
  const diffElement = document.getElementById(`diff-${rowIdx}`);
  const diff = cotton - pcs;
  
  diffElement.innerText = diff;
  
  // رنگ تبدیل کرنے کے لیے (مثبت پر ہرا، منفی پر لال)
  if (diff > 0) {
    diffElement.className = "df p";
  } else if (diff < 0) {
    diffElement.className = "df n";
  } else {
    diffElement.className = "df";
  }
  
  calcTotals();
}

// نیچے ٹوٹل بار کو اپڈیٹ کرنے کا فنکشن
function calcTotals() {
  let totalCotton = 0;
  let totalPcs = 0;
  let totalDiff = 0;
  
  document.querySelectorAll('input[data-col="0"]').forEach(i => totalCotton += parseFloat(i.value) || 0);
  document.querySelectorAll('input[data-col="1"]').forEach(i => totalPcs += parseFloat(i.value) || 0);
  
  totalDiff = totalCotton - totalPcs;
  
  document.getElementById('gc').innerText = totalCotton;
  document.getElementById('gp').innerText = totalPcs;
  document.getElementById('gd').innerText = totalDiff;
}

// مینو اوپن اور کلوز کرنے کے لیے
function tm() {
  document.getElementById('dw').classList.toggle('o');
  document.getElementById('dbg').classList.toggle('o');
}

// الرٹ میسج دکھانے کے لیے
function showToast(msg) {
  const t = document.getElementById('tst');
  t.innerText = msg;
  t.classList.add('s');
  setTimeout(() => t.classList.remove('s'), 2000);
}

function saveData() {
  document.getElementById('ls').innerText = "Yes (Just Now)";
  showToast("ڈیٹا کامیابی سے محفوظ ہو گیا ہے!");
}

function resetFields() {
  document.querySelectorAll('.si').forEach(i => i.value = '');
  document.querySelectorAll('.df').forEach(d => { d.innerText = '0'; d.className = 'df'; });
  calcTotals();
  showToast("تمام فیلڈز صاف کر دیے گئے ہیں!");
}

function updateDate() {
  const today = new Date();
  document.getElementById('cl').innerText = today.toLocaleDateString('ur-PK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

// ایپ اسٹارٹ کریں
window.onload = initApp;
</script>
</body>
</html>
