<!-- Reports & Filters Section -->
<div class="card" style="padding: 15px; margin-bottom: 20px; background: #fff; border-radius: 8px;">
    <h3>📊 Advanced Reports & Filters</h3>
    
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <div>
            <label style="font-size: 12px; font-weight: bold;">From Date:</label>
            <input type="date" id="reportFrom" class="form-control" style="padding: 6px;">
        </div>
        <div>
            <label style="font-size: 12px; font-weight: bold;">To Date:</label>
            <input type="date" id="reportTo" class="form-control" style="padding: 6px;">
        </div>
        <div>
            <label style="font-size: 12px; font-weight: bold;">Filter by Role / Salesman:</label>
            <select id="filterRole" class="form-control" style="padding: 6px;">
                <option value="">All Users / Salesmen</option>
                <option value="Salesman">Salesman</option>
                <option value="Accountant">Accountant</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <button onclick="generateCustomReport()" class="btn btn-primary" style="align-self: flex-end; padding: 7px 15px;">Generate Report</button>
        <button onclick="window.print()" class="btn btn-success" style="align-self: flex-end; padding: 7px 15px;">🖨️ Print / PDF</button>
    </div>
</div>
